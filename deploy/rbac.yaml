apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-operator-defectdojo-importer
  namespace: trivy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator-defectdojo-importer
rules:
  # Trivy-operator report CRDs this importer watches.
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - vulnerabilityreports
      - configauditreports
      - exposedsecretreports
      - infraassessmentreports
      - rbacassessmentreports
    verbs: ["get", "list", "watch"]
  # Needed to resolve the Pod behind a report and read its labels.
  - apiGroups: [""]
    resources: ["pods", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "daemonsets", "statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator-defectdojo-importer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator-defectdojo-importer
subjects:
  - kind: ServiceAccount
    name: trivy-operator-defectdojo-importer
    namespace: trivy-system
