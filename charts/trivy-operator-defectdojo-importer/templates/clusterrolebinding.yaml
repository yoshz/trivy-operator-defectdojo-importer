{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "trivy-operator-defectdojo-importer.fullname" . }}
  labels:
    {{- include "trivy-operator-defectdojo-importer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "trivy-operator-defectdojo-importer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trivy-operator-defectdojo-importer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
